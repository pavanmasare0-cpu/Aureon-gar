name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install app packages and sync Android
        run: |
          npm install
          npx cap sync android

      - name: Write local.properties (Love Camera keys)
        run: |
          echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> android/local.properties
          echo "GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}" >> android/local.properties

      - name: Optional google-services.json
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GS" ]; then echo "$GS" | base64 -d > android/app/google-services.json; fi

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: aureon-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
